[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "srci-client"
dynamic = ["version"]
description = "Python client for the Standard Robot Command Interface (SRCI), ported from the open SRCI PLC library"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thorsten Brach" }]
requires-python = ">=3.12"
dependencies = []
keywords = ["SRCI", "robot", "PROFINET", "PLC", "robotics", "OPC UA"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.optional-dependencies]
opcua = [
    "asyncua>=1.1",  # OPC UA transport (LGPL-3.0, imported only on connect)
]

[project.urls]
Source = "https://github.com/ThorstenBrach/SRCI_CLIENT_PY"
Changelog = "https://github.com/ThorstenBrach/SRCI_CLIENT_PY/blob/main/CHANGELOG.md"
Documentation = "https://github.com/ThorstenBrach/SRCI/wiki"
"PLC library" = "https://github.com/ThorstenBrach/SRCI_CLIENT_PLC"

[tool.hatch.version]
path = "src/srci/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/srci"]

[tool.hatch.build.targets.sdist]
include = ["src/srci", "examples", "docs", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]
