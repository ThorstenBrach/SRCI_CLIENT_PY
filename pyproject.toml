[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "srci-client"
version = "0.1.0.dev0"
description = "Python client for the Standard Robot Command Interface (SRCI), ported from the open SRCI PLC library"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thorsten Brach" }]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Source = "https://github.com/ThorstenBrach/SRCI_PY"
"PLC library" = "https://github.com/ThorstenBrach/SRCI"

[tool.hatch.build.targets.wheel]
packages = ["src/srci"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["src/srci/types/_generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
ignore = [
    "N802", # function names mirror the IEC/ST library (CamelCase)
    "N803", # argument names mirror ST (e.g. AxesGroup)
    "N806", # local variables mirror ST
    "N815", # mixedCase class attributes mirror ST
    "N816",
    "N999", # module names may mirror ST POU names
    "N801", # class names mirror ST POU names (MC_GroupStopFB)
    "SIM300", # upper case ST field names are no constants (SEQ_ACK)
    "SIM108", # ported ST IF/ELSE blocks stay readable 1:1
]

[tool.ruff.lint.pycodestyle]
max-line-length = 140  # ST-Source marker comments

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N", "B011"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/srci", "tools", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tests.*"]
warn_unreachable = false  # attribute narrowing across calls of stateful FBs
strict_equality = false
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "sdk: tests that need the compiled SRCI SDK simulator (skipped if not built)",
    "tcp: tests that open local TCP sockets",
    "slow: long running tests",
]

[tool.coverage.run]
source = ["srci"]
branch = true
