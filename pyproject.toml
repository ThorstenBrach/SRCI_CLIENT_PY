[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-library-py"
version = "0.1.0"
description = "Python conversion of IEC 61131 Robot Library"
authors = [
    {name = "Thorsten Brach", email = "your.email@example.com"},
]
readme = "README.md"
license = {text = "LGPL-3.0"}
requires-python = ">=3.10"
dependencies = [
    # Add dependencies as needed, e.g., numpy for numerical computations
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "flake8",
    "mypy",
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"RobotLibrary" = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__"]
typeCheckingMode = "basic"  # oder "off" für keine Type-Checks

# IEC Types arbeiten mit Descriptors und ctypes - Pylance versteht das nicht vollständig
reportGeneralTypeIssues = false  # Schaltet die meisten Type-Mismatch Warnungen ab
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportIncompatibleVariableOverride = false
reportIncompatibleMethodOverride = false
pythonVersion = "3.10"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"